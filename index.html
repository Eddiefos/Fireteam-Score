<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1F3D2B" />
  <meta name="apple-mobile-web-app-title" content="Fireteam" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Fireteam Score</title> <!-- kul kommentar -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    html { background: #1F3D2B; }
    body {
      background: #F4EFE4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #15110D;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(0.97); }
    button.flat:active { transform: none; }
    input, textarea { font: inherit; }
    .ft-stage {
      min-height: 100dvh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      background: #1F3D2B;
    }
    .ft-phone {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: #F4EFE4;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 480px) {
      .ft-phone {
        margin: 24px;
        min-height: calc(100dvh - 48px);
        border-radius: 44px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        max-width: 420px;
      }
    }
    .ft-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .ft-bottom-pad { padding-bottom: max(28px, env(safe-area-inset-bottom)); }
    .ft-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 220ms ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pop-in { animation: popIn 320ms cubic-bezier(.2,.9,.3,1.2); }
    @keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
